<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Great War — 1914</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet">
<style>:root{
  --ink:#2a2219; --ink2:#5a4a36; --paper:#ebe1c8; --paper2:#e2d5b6; --paper3:#d6c7a2; --leather:#231d17; --leather2:#2f271f;
  --brass:#c9a35a; --brass2:#e2c27f; --red:#9b2f24; --green:#3f6b3a; --blue:#3d5d86; --line:#b9a77f;
  --E:#5f7fa8; --C:#8a7458;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--leather);color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:15px;overflow:hidden}
button{font-family:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{height:54px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(#2f271f,#211b15);border-bottom:2px solid #5b4a30;color:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:5}
#topbar .natname{display:flex;align-items:center;gap:9px;font-family:'IM Fell English SC',serif;font-size:21px;letter-spacing:.5px;white-space:nowrap;color:var(--brass2)}
.flag{width:22px;height:15px;border:1px solid rgba(0,0,0,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);display:inline-block;flex:none}
#topbar .date{font-family:'IM Fell English',serif;font-style:italic;font-size:17px;color:var(--paper);opacity:.9;white-space:nowrap}
#stats{display:flex;gap:4px;flex:1;justify-content:center;min-width:0;overflow:hidden}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:3px 10px;border-left:1px solid #4a3d2b;min-width:0;cursor:default}
.stat:first-child{border-left:none}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#a8977a;white-space:nowrap}
.stat .v{font-size:16px;font-weight:600;white-space:nowrap;color:#f2e8d0}
.stat .d{font-size:11.5px;font-weight:500;margin-left:4px}
.pos{color:#8fbf7f}.neg{color:#e08870}
.tbtn{background:none;border:1px solid #5b4a30;color:var(--brass2);padding:6px 10px;border-radius:3px;cursor:pointer;font-size:14px}
.tbtn:hover{background:#3a3024}
#main{flex:1;display:flex;min-height:0;position:relative}
#mapwrap{flex:1;position:relative;overflow:hidden;background:#8ea6a8;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:default}
#mapmodes{position:absolute;top:10px;left:10px;display:flex;gap:0;background:rgba(35,29,23,.88);border:1px solid #5b4a30;border-radius:4px;overflow:hidden;z-index:2}
#mapmodes button{background:none;border:none;border-right:1px solid #4a3d2b;color:#cbbd9e;padding:6px 11px;cursor:pointer;font-size:13.5px}
#mapmodes button:last-child{border-right:none}
#mapmodes button.on{background:#5b4a30;color:#fff2d6}
#zoomctl{position:absolute;bottom:14px;left:10px;display:flex;flex-direction:column;gap:4px;z-index:2}
#zoomctl button{width:32px;height:32px;background:rgba(35,29,23,.88);border:1px solid #5b4a30;color:var(--brass2);font-size:18px;border-radius:4px;cursor:pointer}
#tooltip{position:absolute;pointer-events:none;background:rgba(235,225,200,.97);border:1px solid #6b5a3e;box-shadow:0 3px 10px rgba(0,0,0,.35);padding:7px 10px;font-size:13.5px;max-width:280px;display:none;z-index:4;line-height:1.35;border-radius:2px}
#tooltip b{font-family:'IM Fell English',serif;font-size:15px}
#tooltip .odds{margin-top:4px;font-weight:600}
#hint{position:absolute;bottom:14px;left:52px;right:14px;text-align:center;pointer-events:none;z-index:2}
#hint span{background:rgba(35,29,23,.85);color:#e8dcc0;padding:5px 12px;border-radius:3px;font-size:13.5px;border:1px solid #5b4a30}
#endturn{position:absolute;right:14px;bottom:14px;z-index:3;background:linear-gradient(#a7322a,#7c231c);color:#fff3dc;border:2px solid #d9a95e;border-radius:4px;padding:10px 18px;font-family:'IM Fell English SC',serif;font-size:19px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5);letter-spacing:.5px}
#endturn small{display:block;font-family:'EB Garamond',serif;font-size:12.5px;opacity:.85;letter-spacing:0;text-transform:none}
#endturn:hover{filter:brightness(1.1)}
#endturn:disabled{filter:grayscale(.7);cursor:wait}
#side{width:390px;flex:none;background:var(--paper);background-image:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(120,90,40,.12),transparent 60%);border-left:2px solid #5b4a30;display:flex;flex-direction:column;min-height:0;box-shadow:-3px 0 10px rgba(0,0,0,.35);z-index:4}
#tabs{display:flex;flex-wrap:wrap;background:#3a3024;border-bottom:2px solid #5b4a30}
#tabs button{flex:1 0 auto;background:none;border:none;color:#cbbd9e;padding:8px 6px;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
#tabs button.on{color:#fff2d6;border-bottom-color:var(--brass);background:#4a3d2b}
#tabs button:disabled{opacity:.4;cursor:default}
#panel{flex:1;overflow-y:auto;padding:14px 16px 90px}
#panel h2{font-family:'IM Fell English',serif;font-weight:400;font-size:25px;margin:0 0 2px;line-height:1.1}
#panel h3{font-family:'IM Fell English SC',serif;font-weight:400;font-size:16px;margin:16px 0 6px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:2px;letter-spacing:.4px}
.sub{color:var(--ink2);font-style:italic;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.kv{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #c9b98f;padding:2px 0}
.kv span:first-child{color:var(--ink2)}
.kv span:last-child{font-weight:600;text-align:right}
.btn{background:#f4ecd8;border:1px solid #8a7550;color:var(--ink);padding:6px 10px;border-radius:3px;cursor:pointer;font-size:14px;margin:2px 3px 2px 0;line-height:1.2}
.btn:hover:not(:disabled){background:#fff8e6;border-color:#5b4a30}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:#5b4a30;color:#fff2d6;border-color:#3a3024}
.btn.primary:hover:not(:disabled){background:#6d5a3a}
.btn.danger{color:var(--red);border-color:#b07060}
.btn.on{background:#5b4a30;color:#fff2d6}
.btn small{opacity:.75;font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:8px;background:#cdbd97;border-radius:2px;overflow:hidden;flex:1;min-width:60px;border:1px solid #a8956b}
.bar>i{display:block;height:100%;background:var(--green)}
.bar.org>i{background:#3d5d86}.bar.ws>i{background:#8a5a2a}.bar.res>i{background:#6a4f8a}
.pips{letter-spacing:2px;color:#5b4a30}
.list .item{display:flex;align-items:center;gap:8px;padding:6px 6px;border-bottom:1px solid #d8c9a5;cursor:pointer;border-radius:2px}
.list .item:hover{background:rgba(255,255,255,.4)}
.list .item.sel{background:rgba(201,163,90,.3)}
.list .item .grow{flex:1;min-width:0}
.tag{font-size:11.5px;padding:1px 6px;border-radius:9px;border:1px solid;white-space:nowrap}
.tag.E{color:#2e4c78;border-color:#7d97bd;background:#dfe7f2}.tag.C{color:#5b4428;border-color:#a88f66;background:#efe3cc}.tag.N{color:#666;border-color:#aaa;background:#eee}.tag.X{color:#888;border-color:#bbb;background:#ddd;text-decoration:line-through}
.muted{color:var(--ink2);font-size:13.5px}
.note{font-size:13.5px;color:var(--ink2);background:rgba(255,255,255,.35);border-left:3px solid var(--brass);padding:6px 9px;margin:8px 0}
.slider{width:100%}
input[type=range]{accent-color:#5b4a30}
.techs{display:flex;flex-direction:column;gap:5px}
.tech{border:1px solid #b9a77f;background:rgba(255,255,255,.3);padding:6px 8px;border-radius:3px;cursor:pointer;font-size:13.5px}
.tech .tn{font-weight:600}
.tech.done{background:rgba(63,107,58,.15);border-color:#7fa070;cursor:default}
.tech.locked{opacity:.5;cursor:not-allowed}
.tech.cur{background:rgba(106,79,138,.18);border-color:#6a4f8a;box-shadow:0 0 0 1px #6a4f8a}
.tech:hover:not(.done):not(.locked){background:rgba(255,255,255,.6)}
.why{font-size:13px}
.why div{display:flex;justify-content:space-between}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line);padding:3px 4px;font-size:12.5px}
table.t td{padding:3px 4px;border-bottom:1px dotted #cdbd97}
table.t td.r,table.t th.r{text-align:right}
.logline{font-size:13.5px;padding:4px 0;border-bottom:1px dotted #cdbd97}
.logline .dt{color:var(--ink2);font-style:italic;margin-right:4px}
.logline.major{font-weight:600}
.logline.bad{color:#7a2a20}.logline.good{color:#2f5a2a}
/* modals */
#modal{position:fixed;inset:0;background:rgba(15,12,9,.72);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.show{display:flex}
.paper{background:var(--paper);background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.45),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(120,90,40,.18),transparent 60%);border:1px solid #6b5a3e;box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 0 60px rgba(140,110,60,.18);max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:26px 30px;position:relative}
.paper h1{font-family:'IM Fell English',serif;font-weight:400;font-size:34px;margin:0 0 4px;text-align:center;line-height:1.1}
.paper .kicker{text-align:center;font-family:'IM Fell English SC',serif;color:var(--ink2);letter-spacing:2px;font-size:14px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:3px 0;margin-bottom:14px}
.paper p{line-height:1.5;margin:8px 0}
.paper .choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.paper .choice{text-align:left;background:#f4ecd8;border:1px solid #8a7550;padding:10px 14px;cursor:pointer;border-radius:3px;font-size:15px;line-height:1.35}
.paper .choice:hover{background:#fff8e6;border-color:#3a3024}
.paper .choice b{font-family:'IM Fell English',serif;font-size:17px;display:block;margin-bottom:2px}
.news{columns:2;column-gap:24px;column-rule:1px solid #b9a77f}
.news .it{break-inside:avoid;margin-bottom:10px;font-size:14.5px;line-height:1.4}
.news .it.major{font-family:'IM Fell English',serif;font-size:17px;line-height:1.25}
.battle{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;padding:5px 0;border-bottom:1px dotted #b9a77f;break-inside:avoid}
.battle .bn{font-weight:600}
.battle .res{font-style:italic;text-align:right}
.telegram{font-family:'Special Elite',monospace;font-size:14px;background:#efe6cf;border:1px dashed #8a7550;padding:10px 12px;margin:10px 0;letter-spacing:.3px}
/* start */
#start{position:fixed;inset:0;z-index:30;background:#1a1612;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}
#start .paper{max-width:980px}
.title{font-family:'IM Fell English',serif;font-size:56px;text-align:center;margin:0;line-height:1;letter-spacing:1px}
.subtitle{text-align:center;font-family:'IM Fell English SC',serif;letter-spacing:3px;color:var(--ink2);margin:6px 0 16px}
.natgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.natcard{border:1px solid #8a7550;background:#f4ecd8;padding:10px 12px;cursor:pointer;border-radius:3px;display:flex;flex-direction:column;gap:4px}
.natcard:hover{background:#fff8e6;border-color:#3a3024;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.natcard .nm{font-family:'IM Fell English',serif;font-size:19px;display:flex;align-items:center;gap:8px}
.natcard .bl{font-size:13px;line-height:1.35;color:var(--ink2)}
.natcard .df{font-size:12px;font-variant:small-caps;letter-spacing:1px}
.howto{font-size:14px;line-height:1.5;columns:2;column-gap:26px;margin-top:14px}
.howto p{margin:0 0 8px;break-inside:avoid}
#loading{position:fixed;inset:0;z-index:40;background:#1a1612;color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'IM Fell English',serif;font-size:24px;font-style:italic}
@media (max-width:900px){
  #side{position:absolute;right:0;left:0;bottom:0;height:46%;width:auto;border-left:none;border-top:2px solid #5b4a30}
  #side.min{height:42px}
  #endturn{bottom:calc(46% + 10px)}
  body.sidemin #endturn{bottom:52px}
  #stats .stat.opt{display:none}
  #topbar{gap:8px;padding:0 8px}
  #topbar .natname{font-size:16px}
  #topbar .natname #tbname{max-width:110px;overflow:hidden;text-overflow:ellipsis}
  #stats{justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .stat{padding:2px 6px;flex:none}
  .stat .k{font-size:9px;letter-spacing:.6px}
  .stat .v{font-size:13px}
  .stat .d{display:none}
  .tbtn{padding:5px 7px;font-size:12px}
  #mapmodes button{padding:5px 7px;font-size:12px}
  .news{columns:1}.howto{columns:1}
  .title{font-size:38px}
  #topbar .date{display:none}
  #hint{display:none}
}
</style></head><body>
<div id="loading">Drawing the map of Europe…</div>
<div id="app">
  <header id="topbar">
    <div class="natname"><span class="flag" id="tbflag"></span><span id="tbname">—</span></div>
    <div class="date" id="tbdate"></div>
    <div id="stats"></div>
    <button class="tbtn" id="btnSave" title="Save game">Save</button>
    <button class="tbtn" id="btnMenu" title="Main menu">Menu</button>
  </header>
  <div id="main">
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="mapmodes">
        <button data-mode="political" class="on">Political</button>
        <button data-mode="alliance">Alliances</button>
        <button data-mode="supply">Supply</button>
        <button data-mode="industry">Industry</button>
      </div>
      <div id="zoomctl"><button id="zin">+</button><button id="zout">−</button></div>
      <div id="tooltip"></div>
      <div id="hint"></div>
      <button id="endturn">End Turn<small id="etdate"></small></button>
    </div>
    <aside id="side">
      <div id="tabs">
        <button data-tab="prov">Province</button>
        <button data-tab="army">Army</button>
        <button data-tab="nation">Nation</button>
        <button data-tab="dip">Diplomacy</button>
        <button data-tab="res">Research</button>
        <button data-tab="trade">Trade</button>
        <button data-tab="ledger">Ledger</button>
      </div>
      <div id="panel"></div>
    </aside>
  </div>
</div>
<div id="modal"></div>
<div id="start" style="display:none"></div>

<script>
// ================= DATA =================
const MAP_W = 1400, MAP_H = 1000;
const projX = lon => (lon + 11) * 25;
const projY = lat => (62 - lat) * 34.5;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DIV_MEN = 15; // thousand men per division

// id: name, adj, color, major, qual, fleet, ws, mpPool(k men), mun, money, empire IC, foodNeed, techs, aggression
const NATIONS = {
  GER:{name:'German Empire',short:'Germany',adj:'German',color:'#6b7079',major:1,qual:1.2,fleet:20,ws:82,mp:1600,mun:160,money:160,empire:0,food:0.22,techs:['heavyArt','mg','recon','uboats','railLog'],aggr:1.35,mob:1.15,
    blurb:'The industrial colossus of Europe, caught between France and Russia. Strike fast in the West before the Russian steamroller arrives, or risk a war of attrition under the British blockade.'},
  AUH:{name:'Austria-Hungary',short:'Austria-Hungary',adj:'Austro-Hungarian',color:'#cfae55',major:1,qual:0.85,fleet:6,ws:66,mp:1100,mun:90,money:110,empire:0,food:0.04,techs:['heavyArt'],aggr:1.45,mob:0.9,
    blurb:'A creaking multinational empire bent on punishing Serbia. Fight on three fronts with a fragile army, and pray Germany comes to your rescue in Galicia.'},
  OTT:{name:'Ottoman Empire',short:'Ottoman Empire',adj:'Ottoman',color:'#a2865a',major:1,qual:0.85,fleet:2,ws:56,mp:500,mun:40,money:60,empire:0,food:0.05,techs:[],aggr:1.6,mob:0.8,
    blurb:'The "sick man of Europe" guards the Dardanelles, Russia\'s lifeline to the world. Neutral for now, courted by Berlin.'},
  BUL:{name:'Kingdom of Bulgaria',short:'Bulgaria',adj:'Bulgarian',color:'#7c8c4c',major:0,qual:0.95,fleet:0,ws:60,mp:300,mun:30,money:40,empire:0,food:0,techs:[],aggr:1.4,mob:1.0,
    blurb:'Humiliated in the Second Balkan War and hungry for Macedonia. Neutral, but leaning towards whoever promises the most.'},
  FRA:{name:'French Republic',short:'France',adj:'French',color:'#5170a8',major:1,qual:1.0,fleet:12,ws:82,mp:1300,mun:120,money:150,empire:6,food:0.1,techs:['recon'],aggr:1.3,mob:1.1,
    blurb:'Bound to Russia, burning to recover Alsace-Lorraine. You must survive the German onslaught, then bleed for every yard of the Western Front.'},
  GBR:{name:'United Kingdom',short:'Britain',adj:'British',color:'#b04c44',major:1,qual:1.1,fleet:32,ws:76,mp:350,mun:90,money:220,empire:10,food:0.55,techs:['dreadnought','recon'],aggr:1.55,mob:0.6,
    blurb:'Master of the seas with a tiny professional army. Blockade Germany, finance your allies, and build a mass army from scratch.'},
  RUS:{name:'Russian Empire',short:'Russia',adj:'Russian',color:'#4e8a5c',major:1,qual:0.76,fleet:8,ws:72,mp:2600,mun:90,money:120,empire:0,food:-0.1,techs:[],aggr:1.3,mob:0.75,
    blurb:'The steamroller: vast manpower, weak industry, shaky government. Strike East Prussia and Galicia before your munitions and your people give out.'},
  ITA:{name:'Kingdom of Italy',short:'Italy',adj:'Italian',color:'#3f988a',major:1,qual:0.85,fleet:8,ws:58,mp:700,mun:60,money:90,empire:0,food:0.18,techs:[],aggr:1.25,mob:1.0,
    blurb:'Nominally allied to Vienna, but Trieste and Trentino are Austrian. Sell your sword to the highest bidder, then fight up the Alps.'},
  SRB:{name:'Kingdom of Serbia',short:'Serbia',adj:'Serbian',color:'#8f4a68',major:0,qual:1.0,fleet:0,ws:88,mp:250,mun:25,money:30,empire:0,food:0,techs:[],aggr:1.5,mob:1.2,
    blurb:'Battle-hardened from the Balkan Wars and the spark of the war. Survive the Austrian punitive expedition.'},
  BEL:{name:'Kingdom of Belgium',short:'Belgium',adj:'Belgian',color:'#d7893a',major:0,qual:0.9,fleet:0,ws:86,mp:150,mun:25,money:40,empire:1,food:0.4,techs:[],aggr:1.8,mob:1.0,
    blurb:'Neutral by treaty, standing directly in the path of the Schlieffen Plan. Hold the forts of Liège and Antwerp.'},
  MNE:{name:'Montenegro',short:'Montenegro',adj:'Montenegrin',color:'#a56c8b',major:0,qual:0.9,fleet:0,ws:80,mp:40,mun:5,money:8,empire:0,food:0,techs:[],aggr:1.6,mob:1.0},
  ROM:{name:'Kingdom of Romania',short:'Romania',adj:'Romanian',color:'#b9755a',major:0,qual:0.75,fleet:0,ws:62,mp:500,mun:30,money:50,empire:0,food:-0.1,techs:[],aggr:1.3,mob:1.0,
    blurb:'Oil and grain, coveting Transylvania. Neutral and waiting to see who is winning.'},
  GRE:{name:'Kingdom of Greece',short:'Greece',adj:'Greek',color:'#86b0d4',major:0,qual:0.8,fleet:2,ws:52,mp:250,mun:20,money:40,empire:0,food:0.1,techs:[],aggr:1.5,mob:1.0},
  USA:{name:'United States',short:'USA',adj:'American',color:'#8a9a6c',major:1,qual:0.95,fleet:16,ws:72,mp:1200,mun:80,money:300,empire:0,food:-0.3,techs:['mg','recon'],aggr:1.3,mob:1.0,offmap:true},
  NED:{name:'Netherlands',short:'Netherlands',adj:'Dutch',color:'#e2a35e',major:0,qual:0.8,fleet:1,ws:60,mp:150,mun:15,money:60,empire:2,food:0.1,techs:[],aggr:2,mob:1},
  LUX:{name:'Luxembourg',short:'Luxembourg',adj:'Luxembourgish',color:'#c4a684',major:0,qual:0.5,fleet:0,ws:60,mp:5,mun:0,money:5,empire:0,food:0,techs:[],aggr:2,mob:1},

// ================= MAP GENERATION & RENDER =================
const RES = 2; // pixel resolution multiplier
const PW = MAP_W * RES, PH = MAP_H * RES;

function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s) {
  return (vnoise(x / 22, y / 22, s) - 0.5) * 1.0 + (vnoise(x / 9, y / 9, s + 7) - 0.5) * 0.5 + (vnoise(x / 4, y / 4, s + 13) - 0.5) * 0.25;
}

const MAP = {}; // filled by buildMap

function buildMap() {
  const seeds = [];
  PROV_DATA.forEach((p, i) => seeds.push({ x: projX(p[2]), y: projY(p[3]), i }));
  const NP = PROV_DATA.length;
  SEA_DATA.forEach((s, j) => seeds.push({ x: projX(s[2]), y: projY(s[3]), i: NP + j }));
  const NS = seeds.length;
  const AMP = 9;
  // displacement field at base res
  const dxF = new Float32Array(MAP_W * MAP_H), dyF = new Float32Array(MAP_W * MAP_H);
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const k = y * MAP_W + x;
    dxF[k] = fbm(x, y, 1) * AMP * 1.6; dyF[k] = fbm(x, y, 2) * AMP * 1.6;
  }
  // buckets
  const B = 20, BW = Math.ceil(MAP_W / B), BH = Math.ceil(MAP_H / B);
  const cand = new Array(BW * BH);
  const r = Math.SQRT2 * B / 2 + AMP * 1.6 * 0.95 + 1;
  for (let by = 0; by < BH; by++) for (let bx = 0; bx < BW; bx++) {
    const cx = (bx + 0.5) * B, cy = (by + 0.5) * B;
    let dmin = 1e9; const ds = new Float32Array(NS);
    for (let s = 0; s < NS; s++) { const d = Math.hypot(seeds[s].x - cx, seeds[s].y - cy); ds[s] = d; if (d < dmin) dmin = d; }
    const list = [];
    for (let s = 0; s < NS; s++) if (ds[s] <= dmin + 2 * r) list.push(s);
    cand[by * BW + bx] = list;
  }
  const pid = new Int16Array(PW * PH);
  for (let py = 0; py < PH; py++) {
    const by0 = py / RES;
    for (let px = 0; px < PW; px++) {
      const bx0 = px / RES;
      const k = (by0 | 0) * MAP_W + (bx0 | 0);
      const qx = bx0 + dxF[k], qy = by0 + dyF[k];
      const list = cand[((by0 / B) | 0) * BW + ((bx0 / B) | 0)];
      let best = 0, bd = 1e18;
      for (let t = 0; t < list.length; t++) {
        const s = seeds[list[t]]; const ddx = s.x - qx, ddy = s.y - qy; const d = ddx * ddx + ddy * ddy;
        if (d < bd) { bd = d; best = s.i; }
      }
      pid[py * PW + px] = best;
    }
  }
  // adjacency, centroids
  const pairCount = new Map(), pairPts = new Map();
  const sumX = new Float64Array(NS), sumY = new Float64Array(NS), cnt = new Float64Array(NS);
  const edge = new Uint8Array(PW * PH); // 1 = boundary pixel
  for (let py = 0; py < PH; py++) for (let px = 0; px < PW; px++) {
    const i = py * PW + px, a = pid[i];
    sumX[a] += px; sumY[a] += py; cnt[a]++;
    if (px + 1 < PW) { const b = pid[i + 1]; if (a !== b) { edge[i] = 1; edge[i + 1] = 1; addPair(a, b, px, py); } }
    if (py + 1 < PH) { const b = pid[i + PW]; if (a !== b) { edge[i] = 1; edge[i + PW] = 1; addPair(a, b, px, py); } }
  }
  function addPair(a, b, px, py) {
    const lo = Math.min(a, b), hi = Math.max(a, b), key = lo * 1000 + hi;
    const c = (pairCount.get(key) || 0) + 1; pairCount.set(key, c);
    if (lo < NP && hi < NP && c % (3 * RES) === 0) {
      let arr = pairPts.get(key); if (!arr) { arr = []; pairPts.set(key, arr); }
      arr.push(px / RES, py / RES);
    }
  }
  const adj = Array.from({ length: NS }, () => new Set());
  for (const [key, c] of pairCount) {
    if (c < 3 * RES) continue;
    const a = Math.floor(key / 1000), b = key % 1000;
    adj[a].add(b); adj[b].add(a);
  }
  const idx = {}; PROV_DATA.forEach((p, i) => idx[p[0]] = i); SEA_DATA.forEach((s, j) => idx[s[0]] = NP + j);
  EXTRA_LINKS.forEach(([a, b]) => { adj[idx[a]].add(idx[b]); adj[idx[b]].add(idx[a]); });
  // coast distance for sea pixels (in pixels)
  const cd = new Uint8Array(PW * PH).fill(255);
  const q = new Int32Array(PW * PH); let qh = 0, qt = 0;
  for (let i = 0; i < PW * PH; i++) if (pid[i] < NP) { cd[i] = 0; }
  for (let i = 0; i < PW * PH; i++) if (pid[i] >= NP) {
    const x = i % PW;
    if ((x > 0 && pid[i - 1] < NP) || (x < PW - 1 && pid[i + 1] < NP) || (i >= PW && pid[i - PW] < NP) || (i < PW * (PH - 1) && pid[i + PW] < NP)) { cd[i] = 1; q[qt++] = i; }
  }
  const MAXD = 30 * RES > 250 ? 250 : 30 * RES;
  while (qh < qt) {
    const i = q[qh++], d = cd[i]; if (d >= MAXD) continue;
    const x = i % PW;
    const nb = [x > 0 ? i - 1 : -1, x < PW - 1 ? i + 1 : -1, i - PW, i + PW];
    for (const j of nb) { if (j < 0 || j >= PW * PH) continue; if (cd[j] > d + 1) { cd[j] = d + 1; q[qt++] = j; } }
  }
  // texture (paper)
  const tex = new Uint8Array(PW * PH);
  for (let py = 0; py < PH; py++) for (let px = 0; px < PW; px++) {
    const n = hash2(px, py, 99) * 0.5 + vnoise(px / 6, py / 6, 5) * 0.5;
    tex[py * PW + px] = 118 + (n * 20) | 0;
  }
  MAP.pid = pid; MAP.edge = edge; MAP.adj = adj; MAP.NP = NP; MAP.NS = NS; MAP.cd = cd; MAP.tex = tex; MAP.idx = idx;
  MAP.pairPts = pairPts;
  MAP.cx = []; MAP.cy = []; MAP.area = [];
  for (let s = 0; s < NS; s++) {
    MAP.area[s] = cnt[s] / (RES * RES);
    if (cnt[s] > 0) { MAP.cx[s] = sumX[s] / cnt[s] / RES; MAP.cy[s] = sumY[s] / cnt[s] / RES; }
    else { MAP.cx[s] = seeds[s].x; MAP.cy[s] = seeds[s].y; }
  }
  // anchor = seed if visible & inside own cell, else centroid
  MAP.ax = []; MAP.ay = [];
  for (let s = 0; s < NS; s++) {
    let ax = seeds[s].x, ay = seeds[s].y;
    const inside = ax >= 4 && ay >= 4 && ax < MAP_W - 4 && ay < MAP_H - 4 && pid[((ay * RES) | 0) * PW + ((ax * RES) | 0)] === s;
    if (!inside) { ax = MAP.cx[s]; ay = MAP.cy[s]; }
    // blend toward centroid a little for nicer placement
    if (inside) { ax = ax * 0.6 + MAP.cx[s] * 0.4; ay = ay * 0.6 + MAP.cy[s] * 0.4; if (pid[((ay * RES) | 0) * PW + ((ax * RES) | 0)] !== s) { ax = seeds[s].x; ay = seeds[s].y; } }
    MAP.ax[s] = ax; MAP.ay[s] = ay;
  }
  // static sea colour buffer
  const sea = new Uint8ClampedArray(PW * PH * 3);
  for (let i = 0; i < PW * PH; i++) {
    if (pid[i] < NP) continue;
    const d = cd[i] / RES, t = tex[i] - 118;
    let r = 158, g = 183, b = 186;
    const shade = Math.max(0, 1 - d / 26);
    r -= shade * 26; g -= shade * 22; b -= shade * 16;
    const dd = d % 6; if (d > 2 && d < 20 && dd > 2.3 && dd < 3.1) { r -= 18; g -= 14; b -= 10; }
    r += t * 0.35; g += t * 0.35; b += t * 0.3;
    sea[i * 3] = r; sea[i * 3 + 1] = g; sea[i * 3 + 2] = b;
  }
  MAP.sea = sea;
  // hill/mountain mask
  MAP.terr = PROV_DATA.map(p => p[7].includes('m') ? 2 : p[7].includes('h') ? 1 : p[7].includes('w') ? 3 : 0);
  MAP.canvas = document.createElement('canvas'); MAP.canvas.width = PW; MAP.canvas.height = PH;
  MAP.ctx = MAP.canvas.getContext('2d');
  MAP.img = MAP.ctx.createImageData(PW, PH);
  MAP.hlCache = {};
}

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixRgb(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

// colours: array per province: fill rgb, stripe rgb|null, border key
function renderMapImage(cols) {
  const { pid, edge, NP, tex, sea, terr } = MAP;
  const d = MAP.img.data;
  const borderKey = cols.key;
  for (let py = 0; py < PH; py++) {
    for (let px = 0; px < PW; px++) {
      const i = py * PW + px, o = i * 4, id = pid[i];
      if (id >= NP) { d[o] = sea[i * 3]; d[o + 1] = sea[i * 3 + 1]; d[o + 2] = sea[i * 3 + 2]; d[o + 3] = 255; continue; }
      let c = cols.fill[id];
      const st = cols.stripe[id];
      if (st && (((px + py) / RES) % 9) < 3.2) c = st;
      const t = (tex[i] - 128) / 128;
      let r = c[0] * (1 + t * 0.22), g = c[1] * (1 + t * 0.22), b = c[2] * (1 + t * 0.22);
      const tr = terr[id];
      if (tr === 2) { const h = vnoise(px / (3 * RES), py / (2 * RES), 31); if (h > 0.62) { r *= 0.8; g *= 0.8; b *= 0.8; } }
      else if (tr === 1) { const h = vnoise(px / (4 * RES), py / (3 * RES), 37); if (h > 0.72) { r *= 0.88; g *= 0.88; b *= 0.88; } }
      else if (tr === 3) { if (((px / RES | 0) % 7 === 0) && ((py / RES | 0) % 5 === 0)) { r *= 0.8; g *= 0.85; b *= 0.8; } }
      if (edge[i]) {
        // check neighbours
        let coast = false, nat = false, prov = false;
        const nbs = [px > 0 ? i - 1 : -1, px < PW - 1 ? i + 1 : -1, py > 0 ? i - PW : -1, py < PH - 1 ? i + PW : -1];
        for (const j of nbs) {
          if (j < 0) continue; const b2 = pid[j]; if (b2 === id) continue;
          if (b2 >= NP) coast = true; else if (borderKey[b2] !== borderKey[id]) nat = true; else prov = true;
        }
        if (coast) { r = 72; g = 62; b = 48; }
        else if (nat) { r *= 0.42; g *= 0.4; b *= 0.4; }

function separatePeace(id, terms, quiet) {

  for (const p of G.provs) {
    if (p.owner === id && p.ctrl !== id) { if (terms === 'cede' && sideOf(p.ctrl) === winners) p.owner = p.ctrl; else p.ctrl = id; }
    else if (p.ctrl === id && p.owner !== id) p.ctrl = p.owner;
  }
  // promises against this nation
  for (const pr of G.promises) {
    const p = P(pr.prov);
    if (p.owner === id && pr.side === winners && sideOf(pr.to) === winners) { p.owner = pr.to; p.ctrl = pr.to; }
  }
  // relocate armies
  for (const a of G.armies) {
    const p = P(a.prov);
    if (a.nat === id && p.ctrl !== id) { const cap = capitalOf(id); if (cap >= 0) { a.prov = cap; a.path = []; } else a.str = 0; }
    else if (a.nat !== id && p.ctrl === id) { const home = nearestFriendly(a.nat, a.prov); if (home >= 0) { a.prov = home; a.path = []; } else a.str = 0; }
    a.path = a.path.filter(j => true); a.sea = null;
  }
  cleanupArmies();
  G.deals = G.deals.filter(d => true);
  if (!quiet) log(`${NATIONS[id].name} has signed a ${terms === 'cede' ? 'humiliating' : 'separate'} peace and leaves the war.`, 'major', [id]);
  checkSideDefeat();
}
function capitalOf(id) { let c = G.provs.find(p => p.owner === id && p.cap && p.ctrl === id); if (c) return c.i; c = G.provs.find(p => p.ctrl === id && p.owner === id); return c ? c.i : -1; }

  while (q.length) { const i = q.shift(); if (friendly(nat, i) && P(i).ctrl !== undefined && i !== from) return i; for (const j of LADJ[i]) if (!seen.has(j)) { seen.add(j); q.push(j); } }
  return capitalOf(nat);
}
function checkCollapse() {
  for (const id in G.nations) {
    const n = N(id); if (!n.side || n.out) continue;
    const occ = occupiedFrac(id); const capP = G.provs.find(p => p.owner === id && p.cap);
    const capLost = capP && capP.ctrl !== id;
    if (NATIONS[id].major && !NATIONS[id].offmap) {
      if ((capLost && occ > 0.5) || occ > 0.7) { log(`${NATIONS[id].name} capitulates!`, 'major', [id]); separatePeace(id, 'cede', true); continue; }
      if (n.ws <= 6 && id !== 'RUS') { log(`Revolution sweeps ${NATIONS[id].short}! The new government sues for peace.`, 'major', [id]); separatePeace(id, 'cede', true); continue; }
    } else if (!NATIONS[id].offmap) {
      const anyLeft = G.provs.some(p => p.owner === id && p.ctrl === id);
      if (!anyLeft && !n.exile) { n.exile = true; G.armies.forEach(a => { if (a.nat === id) a.str = 0; }); cleanupArmies(); log(`${NATIONS[id].short} is completely occupied; its government goes into exile.`, 'major', [id]); }
      if (anyLeft) n.exile = false;
      if (n.ws <= 3 && !n.exile && occ > 0.3) { log(`${NATIONS[id].short}, exhausted, makes a separate peace.`, 'major', [id]); separatePeace(id, 'cede', true); }
    }

}
function checkSideDefeat() {
  if (G.over) return;
  const out = id => N(id).out;
  if (out('GER')) return endWar('E', 'Germany has been forced out of the war.');
  if (out('FRA') && (out('RUS') || out('GBR') || N('GBR').ws < 25)) return endWar('C', 'France has fallen and the Entente has collapsed.');

function playerPeace(target, terms) {

  updateSeaControl();

}

    <button class="btn" data-act="addUnit" data-t="tank" ${!n.fx.tanks || n.money < COSTS.tank ? 'disabled' : ''} title="${n.fx.tanks ? '' : 'Research Landships first'}">+1 Tanks<br><small>${COSTS.tank} funds · ${COSTS.tankMun} mun</small></button></div>
    <p class="muted">Losses are replaced automatically from manpower while the army is in supply.</p>`;
  const others = G.armies.filter(b => b !== a && b.nat === a.nat && b.prov === a.prov).length;

}

// ---------- actions ----------
const ACTIONS = {
  selArmy: d => { const a = G.armies.find(x => x.id === +d.id); if (a) { UI.sel.army = a.id; UI.sel.prov = a.prov; UI.tab = 'army'; } },
  build: d => { startBuild(G.player, UI.sel.prov, d.t); },
  raise: d => { const a = raiseArmy(G.player, UI.sel.prov, +d.d, +d.a); if (a) { UI.sel.army = a.id; UI.tab = 'army'; } },
  addUnit: d => { const a = selArmy(); if (a && !addUnits(a, d.t)) toast('Cannot reinforce here (needs supply, funds, men or munitions).'); },
  moveMode: () => { UI.moveMode = true; },
  cancel: () => { const a = selArmy(); if (a) { a.path = []; a.sea = null; a.violate = false; } },
  split: () => { const a = selArmy(); if (a) { const b = splitArmy(a); if (b) UI.sel.army = b.id; } },
  merge: () => { const a = selArmy(); if (a) mergeArmies(a); },
  disband: () => { const a = selArmy(); if (a) confirmBox(`Disband the ${a.name}? Some of its men return to the manpower pool.`, () => { disband(a); UI.sel.army = null; UI.tab = 'prov'; refresh(); }); },
  consc: d => { me().policy.consc = d.v; },
  pol: d => { const p = me().policy; p[d.v] = !p[d.v]; },
  ship: () => { buildShip(G.player); },
  sortie: () => { const r = fleetSortie(G.player); toast(r.msg); },
  sue: () => confirmBox('Sue for peace? If the enemy accepts, you will cede every province they occupy and leave the war.', () => { const r = playerPeace(Object.keys(G.nations).find(k => atWar(G.player, k)), 'sue'); toast(r.msg); refreshAll(); checkOver(); }),
  dipSel: d => { UI.dipSel = d.id || null; },
  improve: d => { if (!improveRelations(G.player, d.id)) toast('Not enough funds.'); },
  deal: d => { const r = requestDeal(G.player, d.id); toast(r.msg); },
  canceldeal: d => { cancelDeal(G.player, d.id); },
  subsidy: d => { subsidize(G.player, d.id); },
  invite: d => { const r = inviteToWar(G.player, d.id); toast(r.msg); refreshAll(); },
  promise: d => { promise(G.player, d.id, d.k); },
  peace: d => { const r = playerPeace(d.id, d.v); toast(r.msg); refreshAll(); checkOver(); },
  joinSide: d => { joinSide(G.player, d.v); refreshAll(); },
  research: d => { const n = me(); const go = () => { n.res = { id: d.id, prog: n.rp || 0 }; n.rp = 0; renderSide(); }; if (n.res && n.res.prog > 5) confirmBox(`Switch research? Progress on ${TECH[n.res.id].name} will be lost.`, go); else go(); },
};
function refresh() { calcEconomy(me(), true); renderSide(); draw(); }
function refreshAll() { updateSeaControl(); computeSupply(); calcEconomy(me(), true); recolor(); renderSide(); }

// ---------- orders ----------
function expectedHostile(target) {
  // in July 1914, will this nation be an enemy once war starts?
  const ps = ALLIANCE_START.E.includes(G.player) ? 'E' : ALLIANCE_START.C.includes(G.player) ? 'C' : (G.plans.GER === 'W' && ['GBR', 'BEL', 'LUX'].includes(G.player) ? 'E' : null);
  if (!ps) return false;
  let ts = ALLIANCE_START.E.includes(target) ? 'E' : ALLIANCE_START.C.includes(target) ? 'C' : null;
  if (G.plans.GER === 'W' && ['GBR', 'BEL', 'LUX'].includes(target)) ts = 'E';
  return ts && ts !== ps;
}
function orderTo(i) {
  const a = selArmy(); if (!a || a.nat !== G.player) return;
  UI.moveMode = false;
  if (a.fresh) { toast('This army is still organising and can move next month.'); return; }
  if (i === a.prov) { a.path = []; a.sea = null; refresh(); return; }
  const tgt = P(i).ctrl;
  const neutralTarget = !friendly(G.player, i) && !hostileProv(G.player, i);
  const go = () => {
    const r = orderMove(a, i);
    if (!r.ok) { toast('No route to ' + P(i).name + '.'); return; }
    if (neutralTarget) a.violate = true;
    refresh();
  };
  if (neutralTarget) {
    if (G.turn === 0 && expectedHostile(tgt)) { go(); return; }
    if (!me().side && G.turn > 0) { toast('You are not at war. Join a side in the Diplomacy tab first.'); return; }
    if (tgt === G.player) { go(); return; }
    confirmBox(`Invading ${NATIONS[tgt].short} will violate its neutrality: it will join the enemy and every neutral will think less of us.${['BEL', 'NED', 'LUX'].includes(tgt) && !sideOf('GBR') ? ' Britain will certainly declare war.' : ''} Proceed?`, go);
    return;
  }
  go();
}

function setupInput() {
  const c = cv(); const ptrs = new Map(); let drag = null, pinch = null;
  c.addEventListener('pointerdown', e => {

  });

  });

  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { if (!b.disabled) setTab(b.dataset.tab); });
  document.querySelectorAll('#mapmodes button').forEach(b => b.onclick = () => { UI.mode = b.dataset.mode; document.querySelectorAll('#mapmodes button').forEach(x => x.classList.toggle('on', x === b)); recolor(); });

function counterAt(x, y) { for (let k = UI.counters.length - 1; k >= 0; k--) { const c = UI.counters[k]; if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) return c; } return null; }
function leftClick(x, y) {
  const a = selArmy();

  const c = counterAt(x, y);
  if (c) {
    const ids = c.ids; let next = ids[0];
    if (ids.includes(UI.sel.army)) next = ids[(ids.indexOf(UI.sel.army) + 1) % ids.length];
    UI.sel = { prov: c.prov, army: next }; UI.tab = 'army'; renderSide(); draw(); return;
  }

}
function rightClick(x, y) {

}
function hoverAt(x, y) {

  let h = '';
  if (c) {
    const arms = c.ids.map(id => G.armies.find(a => a.id === id)).filter(Boolean);
    h = `<b>${NATIONS[c.nat].adj} forces</b><br>` + arms.map(a => `${esc(a.name)}: ${a.div} div, ${Math.round(a.str * 100)}% str, org ${Math.round(a.org * 100)}%, ent ${a.ent}`).join('<br>');
  } else {
    const p = P(i);
    const gp = garrisonPow(p);
    h = `<b>${esc(p.name)}</b><br>${NATIONS[p.owner].short}${p.ctrl !== p.owner ? ` <span style="color:#9b2f24">(held by ${NATIONS[p.ctrl].short})</span>` : ''} · ${p.terr}${p.fort ? ' · fortress ' + p.fort : ''}${gp ? ' · garrison ' + gp.toFixed(0) : ''}`;
    const arms = armiesIn(i); if (arms.length) h += '<br>' + Object.entries(arms.reduce((m, a) => (m[a.nat] = (m[a.nat] || 0) + a.div, m), {})).map(([k, v]) => `${NATIONS[k].adj}: ${v} div`).join(' · ');

        h += `<div class="odds" style="color:${r > 1.3 ? '#2f5a2a' : r > 1 ? '#7a5a1a' : '#9b2f24'}">Attack odds: ${word}${e.empty ? '' : ' (×' + r.toFixed(2) + ')'}</div>`;

// ---------- modals ----------

// ---------- turn flow ----------

}
function showReport() {

  const rel = b => b.atk.includes(G.player) || b.def.includes(G.player) ? 3 : (ps && (b.atk.some(k => sideOf(k) === ps) || b.def.some(k => sideOf(k) === ps))) ? 1 : 0;
  const battles = rp.battles.filter(b => !b.empty || b.atk.includes(G.player) || b.def.includes(G.player)).sort((a, b) => rel(b) - rel(a) || (b.atkLoss + b.defLoss) - (a.atkLoss + a.defLoss)).slice(0, 14);

  if (headline) h += `<h1 style="${headline.length > 90 ? 'font-size:24px' : headline.length > 60 ? 'font-size:28px' : ''}">${esc(headline)}</h1>`;
  else h += `<h1>${battles.length ? 'Heavy Fighting Reported' : 'All Quiet on the Front'}</h1>`;
  h += `<div class="news">`;
  for (const n of news) if (n.txt !== headline) h += `<div class="it ${n.type}">${esc(n.txt)}</div>`;
  if (battles.length) {

    for (const b of battles) {
      const atkN = b.atk.map(k => NATIONS[k].adj).join('-');
      const mine = b.atk.includes(G.player) ? 'atk' : (b.def.includes(G.player) || b.ctrlBefore === G.player) ? 'def' : null;
      let res = b.empty ? `${atkN} troops occupy it unopposed` : b.result === 'captured' ? (b.garrison ? `taken by ${atkN} troops` : `${atkN} breakthrough`) : `${atkN} attack repulsed`;
      const good = mine === 'atk' ? b.result === 'captured' : mine === 'def' ? b.result !== 'captured' : null;
      h += `<div class="battle"><span class="bn">${b.empty ? '' : 'Battle of '}${esc(P(b.prov).name)}</span><span class="res" style="color:${good === null ? 'inherit' : good ? '#2f5a2a' : '#9b2f24'}">${res}</span>${b.empty ? '' : `<span class="muted">${b.garrison ? b.atkDiv + ' div vs local garrison' : b.atkDiv + ' vs ' + b.defDiv + ' div'}${b.ent ? ', defenders entrenched (' + b.ent + ')' : ''}${mine === 'def' && b.result === 'captured' ? ' — <b style="color:#9b2f24">our territory</b>' : ''}</span><span class="muted">${fmtMen(b.atkLoss)} / ${fmtMen(b.defLoss)} lost</span>`}</div>`;

// ---------- start ----------
const DIFF = { GER: 'Moderate', FRA: 'Moderate', GBR: 'Easy', RUS: 'Hard', AUH: 'Hard', ITA: 'Moderate', OTT: 'Hard', SRB: 'Very hard', BUL: 'Moderate', ROM: 'Hard', BEL: 'Very hard' };
function showStart() {

    <p><b>Combined attacks:</b> order several armies into the same province in one turn and they attack together. Home provinces are also defended by local garrisons and by reserves from neighbouring provinces.</p>
    <p><b>The trenches:</b> armies that stand still dig in — only lightly in the war of movement of 1914, deeper from 1915 and deeper still with research. Entrenched defenders, fortresses and mountains multiply defence. Hover over an enemy province with an army selected to see the odds.</p>
    <p><b>Supply:</b> armies cut off from friendly territory waste away. Use the Supply map to spot pockets. Losses are replaced from manpower each month.</p>

function pickNation(id) {

    pl.opts.map(o => `<button class="choice" data-v="${o.id}"><b>${o.name}</b>${o.desc}</button>`).join('') + `</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="back">Back</button></div>`;

  m.querySelector('#back').onclick = () => { closeModal(); $('modal').style.zIndex = ''; };
}
function startGame(id, plan) {

  computeSupply();
  enterGame(true);
}
function enterGame(fresh) {

  UI.sel = { prov: null, army: null }; UI.tab = 'nation'; UI.dipSel = null; UI.moveMode = false;
  resize(); const cap = capitalOf(G.player); UI.s = UI.vw < 700 ? 0.75 : 1.6; fitView(cap); UI.s = Math.max(UI.s, UI.vw < 700 ? 0.75 : 1.6); if (cap >= 0) { UI.ox = UI.vw / 2 - MAP.ax[cap] * UI.s; UI.oy = UI.vh / 2 - MAP.ay[cap] * UI.s; } clampView();

    const h = `<div class="kicker">TELEGRAM · ${dateStr().toUpperCase()}</div><h1>The July Crisis</h1>
      <div class="telegram">ARCHDUKE FRANZ FERDINAND ASSASSINATED SARAJEVO STOP AUSTRIA-HUNGARY PREPARES ULTIMATUM TO SERBIA STOP RUSSIA WILL NOT ABANDON SERBIA STOP GERMANY STANDS BEHIND VIENNA STOP</div>
      <p>You lead <b>${NATIONS[G.player].name}</b>.${plan ? ` Your General Staff has adopted <b>${plan.name}</b>.` : ''} This is the last month of peace: move your armies into position. When you end the turn, the ultimatums expire and Europe goes to war.</p>
      <p class="muted">Tip: select an army and right-click a province to order it. Orders into soon-to-be enemy territory will be carried out the moment war is declared.</p>
